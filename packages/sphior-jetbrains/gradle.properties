org.gradle.jvmargs=-Xmx2048m
org.gradle.caching=true
# IntelliJ Platform Gradle Plugin 2.1.0 の GenerateManifestTask が configuration cache と非互換のため無効化
org.gradle.configuration-cache=false
kotlin.stdlib.default.dependency=false
# Homebrew の JDK は Gradle の自動検出パスに入らないため明示指定（toolchain 21 解決用）
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home,/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
